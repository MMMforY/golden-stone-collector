[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-stone-collector"
version = "0.1.0"
description = "在不打断思考的情况下保存认知现场。Windows / macOS 连续资料收集器。"
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.10.3",
  "Pillow==12.3.0",
  "platformdirs==4.12.2",
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0", "pyinstaller==6.22.3"]

[project.gui-scripts]
golden-stone-collector = "golden_stone_collector.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golden_stone_collector = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

