name: Test and build preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            label: windows-x64
          - os: macos-14
            architecture: arm64
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/smoke-*.json
            test-results.xml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.zip artifacts/**/*.sha256 artifacts/**/smoke-*.json)
          test "${#files[@]}" -ge 6
          gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME 预览版" --notes-file docs/RELEASE.md "${files[@]}"
